[package]
name = "lb-proxy"
version = "0.1.0"
edition = "2021"
description = "Thin reverse proxy wrapping the router-core P2C load balancer"
license = "MIT"

[dependencies]
router-core = { path = "../router-core" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
serde_json = "1"

[dev-dependencies]
# Tests reuse the runtime/deps above; no extra dev-deps needed.